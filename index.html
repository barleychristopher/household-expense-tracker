<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075e59"><meta name="description" content="A simple private household expense tracker.">
  <link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Household Expense Tracker</title>
  <style>
    :root{--green:#075e59;--green2:#0b8176;--mint:#e3f5ef;--ink:#162d3d;--muted:#657684;--line:#e4e9ed;--bg:#f4f7f8;--white:#fff;--red:#b93838;--amber:#b76b08;--shadow:0 8px 28px rgba(20,50,60,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}.app-header{background:var(--green);color:white;padding:22px 18px 20px;border-radius:0 0 24px 24px}.header-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:#ffffff20;display:grid;place-items:center;font-size:23px}.brand h1{font-size:18px;line-height:1.15;margin:0}.brand p{margin:4px 0 0;color:#c7e8e2;font-size:12px}.month-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}.month-row h2{font-size:16px;margin:0}.month-row input{max-width:155px;background:#ffffff16;color:white;border:1px solid #ffffff45;border-radius:10px;padding:8px;color-scheme:dark}.wrap{max-width:760px;margin:0 auto}.content{padding:16px;max-width:760px;margin:auto}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-2px}.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}.metric-label{font-size:12px;color:var(--muted);font-weight:600}.metric{font-size:clamp(20px,5vw,27px);font-weight:750;letter-spacing:-.8px;margin:5px 0 2px;overflow-wrap:anywhere}.metric-note{font-size:12px;color:var(--muted)}.hero-card{margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}.section-head h2{font-size:17px;margin:0}.link-btn{border:0;background:none;color:var(--green2);font-weight:700;padding:5px}.progress{height:8px;border-radius:99px;background:#e9eff1;overflow:hidden;margin:12px 0 7px}.progress span{display:block;height:100%;background:var(--green2);border-radius:99px}.progress.over span{background:var(--red)}.budget-row,.tx-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.budget-row:last-child,.tx-row:last-child{border-bottom:0}.cat-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;font-size:19px}.row-main{flex:1;min-width:0}.row-main strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-main small{color:var(--muted);font-size:12px}.row-amount{text-align:right;white-space:nowrap;font-weight:750;font-size:14px}.row-amount small{display:block;font-size:11px;color:var(--muted);font-weight:500}.positive{color:#15805c}.negative{color:var(--red)}.primary{border:0;border-radius:13px;background:var(--green);color:white;font-weight:700;padding:12px 16px;min-height:45px}.primary:active{transform:scale(.99)}.secondary{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:650}.danger{border:1px solid #f0c8c8;color:var(--red);background:#fff7f7;border-radius:12px;padding:10px 13px;font-weight:650}.fab{position:fixed;right:max(20px,calc((100vw - 720px)/2));bottom:calc(91px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;background:var(--green);color:white;border:0;font-size:29px;box-shadow:0 9px 24px #075e5940;z-index:5}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:6}.nav button{border:0;background:none;color:#72818c;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}.nav button span{font-size:20px;line-height:1.1}.nav button.active{color:var(--green);font-weight:800}.page-title{font-size:23px;margin:6px 0 4px;letter-spacing:-.6px}.subtext{margin:0;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;align-items:center;margin:16px 0;flex-wrap:wrap}.toolbar input,.toolbar select{flex:1;min-width:130px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-weight:700;font-size:13px}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:12px;border:1px solid #d7e0e4;border-radius:12px;background:white;color:var(--ink);min-height:46px}.field textarea{min-height:76px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-backdrop{position:fixed;inset:0;background:#0b202b80;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0}.modal{background:var(--bg);width:100%;max-width:600px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #0002}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{margin:0;font-size:20px}.close-btn{width:36px;height:36px;border:0;background:#e8eeee;border-radius:12px;font-size:21px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions>*{flex:1}.hidden{display:none!important}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:var(--mint);color:var(--green);font-size:11px;font-weight:750}.empty{text-align:center;padding:30px 15px;color:var(--muted)}.empty .emoji{font-size:34px}.empty strong{display:block;color:var(--ink);margin:8px}.chart{display:flex;align-items:end;gap:10px;height:170px;padding:15px 4px 0;border-bottom:1px solid var(--line)}.bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px;min-width:0}.bar{width:min(34px,75%);background:linear-gradient(180deg,#22a18f,#08736b);border-radius:8px 8px 2px 2px;min-height:3px}.bar-label{font-size:10px;color:var(--muted)}.bar-value{font-size:10px;color:var(--muted);white-space:nowrap}.category-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;font-size:13px}.category-line:last-child{border:0}.notice{background:#fff7df;border:1px solid #f0e0a6;border-radius:14px;padding:12px;font-size:12px;color:#78530c;margin:12px 0}.success-note{background:#e5f7ef;border-radius:12px;padding:12px;color:#116b4e;font-size:13px;margin:10px 0}.settings-block{margin:14px 0}.settings-block h3{font-size:15px;margin:0 0 8px}.setting-line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.setting-line:last-child{border:0}.setting-line small{display:block;color:var(--muted);font-size:12px}.tiny{font-size:11px;color:var(--muted)}.inline-edit{display:flex;gap:8px;align-items:center}.inline-edit input{width:110px;padding:9px;border:1px solid var(--line);border-radius:10px}.person-chip{display:inline-block;background:#eaf0ff;color:#3157a5;border-radius:8px;padding:3px 7px;font-size:11px;font-weight:700;margin-top:4px}
    @media(min-width:600px){.app-header{border-radius:0 0 28px 28px;padding:26px 26px 22px}.content{padding:22px}.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:24px}.fab{bottom:100px}.summary-grid{grid-template-columns:repeat(4,1fr)}.metric{font-size:22px}}
  </style>
</head>
<body>
<header class="app-header"><div class="wrap"><div class="header-top"><div class="brand"><div class="logo">◈</div><div><h1>Household Tracker</h1><p>Better money habits, together</p></div></div><button class="secondary" id="headerAdd" style="background:#ffffff18;border-color:#ffffff3d;color:white">＋ Add</button></div><div class="month-row"><h2 id="headerMonth">This month</h2><input id="monthPicker" type="month" aria-label="Choose month"></div></div></header>
<main id="app" class="content"></main>
<button class="fab" id="fab" aria-label="Add transaction">＋</button>
<nav class="nav" aria-label="Main navigation"><button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="transactions"><span>☷</span>Activity</button><button data-page="budgets"><span>◴</span>Budgets</button><button data-page="household"><span>⇄</span>Split bills</button><button data-page="reports"><span>▥</span>Reports</button><button data-page="settings"><span>⚙</span>Settings</button></nav>
<div id="modalRoot"></div>
<script>
(()=>{
'use strict';
const KEY='householdExpenseTracker.v1';
const defaultCategories=[
 {name:'Groceries',icon:'🛒',color:'#e2f5ed',budget:450},{name:'Household bills',icon:'🏠',color:'#e9e7ff',budget:500},{name:'Eating out',icon:'🍽️',color:'#fff0dc',budget:180},{name:'Transport',icon:'🚗',color:'#e0f2fb',budget:220},{name:'Shopping',icon:'🛍️',color:'#fbe5ec',budget:150},{name:'Health',icon:'💊',color:'#e8f5df',budget:80},{name:'Subscriptions',icon:'📺',color:'#e9edf4',budget:60},{name:'Pets',icon:'🐾',color:'#fff2d5',budget:80},{name:'Leisure',icon:'🎟️',color:'#f0e6ff',budget:120},{name:'Other',icon:'✳️',color:'#edf1f3',budget:100}
];
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const monthISO=()=>todayISO().slice(0,7);
const initial=()=>({version:4,people:['Me','Partner'],categories:defaultCategories.map(x=>({...x,name:x.name,budget:x.name==='Groceries'?500:x.budget})),transactions:[],budgetsMonth:monthISO(),incomes:{me:0,partner:0,rent:0,propertyCosts:0},bills:[],personalBills:[],groceryBudget:500,reimbursements:{},personalBudgets:{me:0,partner:0}});
let state=load();let page='home';let editingId=null;let filters={search:'',category:'all',person:'all',type:'all'};let reportMonth=monthISO();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&(v.version===1||v.version===2||v.version===3||v.version===4)&&Array.isArray(v.transactions)&&Array.isArray(v.categories)){v.version=4;v.incomes=v.incomes||{me:0,partner:0,rent:0,propertyCosts:0};v.bills=Array.isArray(v.bills)?v.bills:[];v.personalBills=Array.isArray(v.personalBills)?v.personalBills:[];v.groceryBudget=Number.isFinite(Number(v.groceryBudget))?Number(v.groceryBudget):500;v.reimbursements=v.reimbursements&&typeof v.reimbursements==='object'?v.reimbursements:{};v.personalBudgets=v.personalBudgets&&typeof v.personalBudgets==='object'?v.personalBudgets:{me:0,partner:0};const groceries=v.categories.find(c=>c.name==='Groceries');if(groceries&&groceries.budget===450)groceries.budget=500;v.transactions.forEach(t=>{if(!t.scope)t.scope=t.category==='Groceries'||t.category==='Household bills'?'shared':'personal'});return v}}catch(e){}return initial()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Your browser could not save this change. Please export a backup and free some device storage.');return false}}
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat=n=>state.categories.find(c=>c.name===n)||{name:n||'Other',icon:'✳️',color:'#edf1f3',budget:0};
const monthName=m=>new Date(`${m}-01T12:00:00`).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const fmtDate=s=>new Date(`${s}T12:00:00`).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const monthTx=(m=monthISO())=>state.transactions.filter(t=>t.date?.startsWith(m));
const total=(tx,type)=>tx.filter(t=>!type||t.type===type).reduce((a,t)=>a+Number(t.amount||0),0);
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function updateHeader(){const m=document.getElementById('monthPicker').value||monthISO();document.getElementById('headerMonth').textContent=monthName(m);}
function render(){updateHeader();const app=document.getElementById('app');if(page==='home')app.innerHTML=homePage();else if(page==='transactions')app.innerHTML=transactionsPage();else if(page==='budgets')app.innerHTML=budgetsPage();else if(page==='household')app.innerHTML=householdPage();else if(page==='reports')app.innerHTML=reportsPage();else app.innerHTML=settingsPage();bindDynamic();}
function homePage(){const m=document.getElementById('monthPicker').value||monthISO(),tx=monthTx(m),spent=total(tx,'expense'),income=total(tx,'income'),net=income-spent,budget=state.categories.reduce((s,c)=>s+Number(c.budget||0),0),remaining=budget-spent,expenses=tx.filter(t=>t.type==='expense');const byCat=state.categories.map(c=>({...c,spent:total(expenses.filter(t=>t.category===c.name))})).filter(c=>c.spent>0).sort((a,b)=>b.spent-a.spent).slice(0,5);const recent=[...tx].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt).slice(0,5);return `
 <div class="summary-grid"><div class="card"><div class="metric-label">Spent this month</div><div class="metric">${money(spent)}</div><div class="metric-note">Household expenses</div></div><div class="card"><div class="metric-label">Money in</div><div class="metric positive">${money(income)}</div><div class="metric-note">Income recorded</div></div><div class="card"><div class="metric-label">Budget left</div><div class="metric ${remaining<0?'negative':''}">${money(remaining)}</div><div class="metric-note">Of ${money(budget)} total</div></div><div class="card"><div class="metric-label">Net recorded</div><div class="metric ${net<0?'negative':'positive'}">${money(net)}</div><div class="metric-note">Income minus spending</div></div></div>
 <div class="section-head"><h2>Household monthly summary</h2><button class="link-btn" data-goto="household">Manage →</button></div><div class="card"><div class="summary-grid" style="margin:0"><div><div class="metric-label">${esc(state.people[0]||'You')} salary</div><div class="metric">${money(splitData(m).me)}</div></div><div><div class="metric-label">${esc(state.people[1]||'Your wife')} salary</div><div class="metric">${money(splitData(m).partner)}</div></div><div><div class="metric-label">Net rental income</div><div class="metric">${money(splitData(m).netRent)}</div></div><div><div class="metric-label">Recurring bills</div><div class="metric">${money(splitData(m).billsGross)}</div></div></div><div class="setting-line"><div><strong>Shared groceries</strong><small>Of ${money(splitData(m).groceryBudget)} monthly budget</small></div><div class="row-amount">${money(splitData(m).grocerySpent)}<small>${money(splitData(m).groceryLeft)} left</small></div></div><div class="setting-line"><div><strong>${esc(state.people[0]||'Your')} estimated disposable income</strong><small>After shared contributions, personal recurring bills and logged personal spending</small></div><div class="row-amount ${splitData(m).meDisposable<0?'negative':'positive'}">${money(splitData(m).meDisposable)}</div></div><div class="setting-line"><div><strong>${esc(state.people[1]||'Your wife')}'s estimated disposable income</strong><small>After shared contributions, personal recurring bills and logged personal spending</small></div><div class="row-amount ${splitData(m).partnerDisposable<0?'negative':'positive'}">${money(splitData(m).partnerDisposable)}</div></div><div class="success-note"><div class="metric-label">Monthly settlement</div><div class="metric">${money(Math.abs(splitData(m).partnerOwes))}</div><div class="metric-note">${splitData(m).partnerOwes>=0?esc(state.people[1]||'Your wife')+' owes '+esc(state.people[0]||'you'):'You owe '+esc(state.people[1]||'your wife')}</div></div><p class="tiny">Disposable income is an estimate using the monthly salary figures, current bill and grocery records, personal recurring bills and personal transactions entered in the app. It is not a bank balance.</p></div>
 <div class="card hero-card"><div class="section-head" style="margin:0 0 5px"><h2>Monthly budget</h2><span class="pill">${budget?Math.round(spent/budget*100):0}% used</span></div><div class="progress ${spent>budget?'over':''}"><span style="width:${Math.min(100,budget?spent/budget*100:0)}%"></span></div><div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)"><span>${money(spent)} spent</span><span>${money(Math.max(0,remaining))} left</span></div></div>
 <div class="section-head"><h2>Spending by category</h2><button class="link-btn" data-goto="budgets">Budgets →</button></div><div class="card">${byCat.length?byCat.map(c=>`<div class="budget-row"><div class="cat-icon" style="background:${c.color}">${c.icon}</div><div class="row-main"><strong>${esc(c.name)}</strong><small>${c.budget?Math.round(c.spent/c.budget*100)+'% of '+money(c.budget):'No budget set'}</small><div class="progress ${c.spent>c.budget&&c.budget?'over':''}" style="margin:6px 0 0"><span style="width:${Math.min(100,c.budget?c.spent/c.budget*100:0)}%"></span></div></div><div class="row-amount">${money(c.spent)}</div></div>`).join(''):'<div class="empty"><div class="emoji">🧾</div><strong>No spending recorded yet</strong>Add your first expense to see your breakdown.</div>'}</div>
 <div class="section-head"><h2>Recent activity</h2><button class="link-btn" data-goto="transactions">See all →</button></div><div class="card">${recent.length?recent.map(txRow).join(''):'<div class="empty"><div class="emoji">👋</div><strong>Start tracking together</strong>Tap the + button to add an expense or income.</div>'}</div>`}
function txRow(t){const c=cat(t.category);return `<div class="tx-row"><div class="cat-icon" style="background:${c.color}">${t.type==='income'?'💷':c.icon}</div><div class="row-main"><strong>${esc(t.description||t.category)}</strong><small>${esc(t.category)} · ${fmtDate(t.date)} · ${esc(t.person||'Me')} · ${t.scope==='shared'?'Shared':'Personal'}</small></div><div class="row-amount ${t.type==='income'?'positive':''}">${t.type==='income'?'+':'−'}${money(t.amount)}<small>${esc(t.method||'')}</small></div><button class="link-btn" data-edit="${t.id}" aria-label="Edit transaction">···</button></div>`}
function transactionsPage(){const m=document.getElementById('monthPicker').value||monthISO();let tx=monthTx(m).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);if(filters.search)tx=tx.filter(t=>(t.description+' '+t.category+' '+(t.notes||'')).toLowerCase().includes(filters.search.toLowerCase()));if(filters.category!=='all')tx=tx.filter(t=>t.category===filters.category);if(filters.person!=='all')tx=tx.filter(t=>t.person===filters.person);if(filters.type!=='all')tx=tx.filter(t=>t.type===filters.type);return `<h1 class="page-title">Activity</h1><p class="subtext">All household transactions for ${monthName(m)}.</p><div class="toolbar"><input id="txSearch" placeholder="Search transactions" value="${esc(filters.search)}"/><select id="txType"><option value="all">All types</option><option value="expense" ${filters.type==='expense'?'selected':''}>Expenses</option><option value="income" ${filters.type==='income'?'selected':''}>Income</option></select></div><div class="toolbar" style="margin-top:-7px"><select id="txCategory"><option value="all">All categories</option>${state.categories.map(c=>`<option ${filters.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="txPerson"><option value="all">Everyone</option>${state.people.map(p=>`<option ${filters.person===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="card"><div class="metric-label">${tx.length} transaction${tx.length===1?'':'s'} · ${money(total(tx,'expense'))} expenses</div>${tx.length?tx.map(txRow).join(''):'<div class="empty"><div class="emoji">🔎</div><strong>No matching transactions</strong>Try another search or add a transaction.</div>'}</div><div class="tiny" style="margin-top:12px">Tap ··· beside a transaction to edit or delete it.</div>`}
function budgetsPage(){const m=document.getElementById('monthPicker').value||monthISO(),tx=monthTx(m).filter(t=>t.type==='expense'),spent=total(tx),budget=state.categories.reduce((s,c)=>s+Number(c.budget||0),0);return `<h1 class="page-title">Budgets</h1><p class="subtext">Set monthly limits and keep your household on track.</p><div class="card hero-card"><div class="metric-label">Total budget</div><div class="metric">${money(budget)}</div><div class="metric-note">${money(spent)} spent in ${monthName(m)}</div><div class="progress ${spent>budget?'over':''}"><span style="width:${Math.min(100,budget?spent/budget*100:0)}%"></span></div></div><div class="section-head"><h2>Category limits</h2><button class="link-btn" id="addCategory">＋ Category</button></div><div class="card">${state.categories.map(c=>{const s=total(tx.filter(t=>t.category===c.name));return `<div class="budget-row"><div class="cat-icon" style="background:${c.color}">${c.icon}</div><div class="row-main"><strong>${esc(c.name)}</strong><small>${money(s)} spent · ${c.budget?money(Math.max(0,c.budget-s))+' left': 'No limit set'}</small><div class="progress ${s>c.budget&&c.budget?'over':''}" style="margin:6px 0 0"><span style="width:${Math.min(100,c.budget?s/c.budget*100:0)}%"></span></div></div><div class="inline-edit"><input aria-label="${esc(c.name)} monthly budget" type="number" min="0" step="10" value="${Number(c.budget)||0}" data-budget="${esc(c.name)}" style="width:82px"><button class="link-btn" data-editcat="${esc(c.name)}" aria-label="Edit category">✎</button></div></div>`}).join('')}</div><p class="tiny">Change an amount to update a monthly limit. A budget is a guide, not a bank balance.</p>`}
function reportsPage(){const m=document.getElementById('monthPicker').value||monthISO(),tx=monthTx(m),expenses=tx.filter(t=>t.type==='expense'),spent=total(expenses),income=total(tx,'income');const days=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;days.push({key,label:d.toLocaleDateString('en-GB',{month:'short'}),value:total(monthTx(key),'expense')})}const max=Math.max(1,...days.map(x=>x.value));const cats=state.categories.map(c=>({...c,spent:total(expenses.filter(t=>t.category===c.name))})).filter(c=>c.spent>0).sort((a,b)=>b.spent-a.spent);return `<h1 class="page-title">Reports</h1><p class="subtext">Understand your spending habits over time.</p><div class="summary-grid" style="margin-top:16px"><div class="card"><div class="metric-label">Expenses</div><div class="metric">${money(spent)}</div></div><div class="card"><div class="metric-label">Income</div><div class="metric positive">${money(income)}</div></div></div><div class="section-head"><h2>Last six months</h2></div><div class="card"><div class="chart">${days.map(d=>`<div class="bar-wrap"><div class="bar-value">${d.value>=1000?'£'+(d.value/1000).toFixed(1)+'k':'£'+Math.round(d.value)}</div><div class="bar" style="height:${Math.max(3,d.value/max*72)}%"></div><div class="bar-label">${d.label}</div></div>`).join('')}</div><p class="tiny">Monthly household expenses, based on the transactions saved in this app.</p></div><div class="section-head"><h2>Category breakdown</h2></div><div class="card">${cats.length?cats.map(c=>`<div class="category-line"><span>${c.icon} ${esc(c.name)}</span><strong>${money(c.spent)} <span class="tiny">${spent?Math.round(c.spent/spent*100):0}%</span></strong></div>`).join(''):'<div class="empty">Add expenses to build your report.</div>'}</div><div class="section-head"><h2>Who paid?</h2></div><div class="card">${state.people.map(p=>{const v=total(expenses.filter(t=>t.person===p));return `<div class="category-line"><span>👤 ${esc(p)}</span><strong>${money(v)}</strong></div>`}).join('')}</div>`}

function rentalNet(){return Number(state.incomes.rent||0)-Number(state.incomes.propertyCosts||0)}
function monthlyBillAmount(b){const n=Number(b.amount)||0;return b.frequency==='weekly'?n*52/12:b.frequency==='quarterly'?n/3:b.frequency==='annually'?n/12:n}
function splitData(m=document.getElementById('monthPicker')?.value||monthISO()){
 const inc=state.incomes||{},netRent=Math.max(0,rentalNet()),me=Math.max(0,Number(inc.me)||0),partner=Math.max(0,Number(inc.partner)||0);
 const salaryPot=me+partner,mePct=salaryPot>0?me/salaryPot:0.5,partnerPct=1-mePct;
 const billsGross=state.bills.filter(b=>b.active!==false).reduce((s,b)=>s+monthlyBillAmount(b),0);
 const personalBillTotals={me:0,partner:0};state.personalBills.filter(b=>b.active!==false).forEach(b=>{personalBillTotals[b.person==='partner'?'partner':'me']+=monthlyBillAmount(b)});
 // Net rent is applied directly to the recurring bills because it is received into the account that pays them.
 const rentApplied=Math.min(netRent,billsGross),billBalance=Math.max(0,billsGross-netRent);
 const tx=monthTx(m),groceries=tx.filter(t=>t.type==='expense'&&t.category==='Groceries'&&t.scope!=='personal');
 const grocerySpent=total(groceries),groceryPaidByPartner=total(groceries.filter(t=>t.person===state.people[1]));
 const groceryBudget=Number(state.groceryBudget)||500;
 const personalExpenses=tx.filter(t=>t.type==='expense'&&t.scope==='personal');
 const mePersonalSpent=total(personalExpenses.filter(t=>t.person===state.people[0]));
 const partnerPersonalSpent=total(personalExpenses.filter(t=>t.person===state.people[1]));
 const mePersonalBudget=Number(state.personalBudgets?.me)||0,partnerPersonalBudget=Number(state.personalBudgets?.partner)||0;
 const partnerBillShare=billBalance*partnerPct,partnerGroceryShare=grocerySpent*partnerPct;
 const partnerTransfers=Math.max(0,Number(state.reimbursements[m])||0);
 const partnerOwes=partnerBillShare+partnerGroceryShare-groceryPaidByPartner-partnerTransfers;
 const meBillShare=billBalance*mePct,meGroceryShare=grocerySpent*mePct;
 const meDisposable=me-meBillShare-meGroceryShare-personalBillTotals.me-mePersonalSpent;
 const partnerDisposable=partner-partnerBillShare-partnerGroceryShare-personalBillTotals.partner-partnerPersonalSpent;
 return {netRent,me,partner,salaryPot,mePct,partnerPct,billsGross,rentApplied,billBalance,grocerySpent,groceryBudget,groceryLeft:groceryBudget-grocerySpent,groceryPaidByPartner,partnerBillShare,partnerGroceryShare,partnerTransfers,partnerOwes,meBillShare,meGroceryShare,totalShared:billBalance+grocerySpent,mePersonalSpent,partnerPersonalSpent,mePersonalBudget,partnerPersonalBudget,personalBillTotals,meDisposable,partnerDisposable};
}
function householdPage(){const m=document.getElementById('monthPicker').value||monthISO(),d=splitData(m),i=state.incomes;return `<h1 class="page-title">Your household split</h1><p class="subtext">Your accounts stay separate. Shared bills are paid from your account, rental income offsets those bills, and your wife's share is tracked here.</p>

<div class="section-head"><h2>Recurring household bills</h2><button class="primary" id="addBill">＋ Add bill</button></div><p class="subtext">Only active bills listed here are included. Enter the full bill amount; the app applies net rent against the total automatically.</p><div class="card">${state.bills.length?state.bills.map((b,idx)=>`<div class="setting-line"><div style="min-width:0"><strong>${esc(b.name)}</strong><small>${money(monthlyBillAmount(b))}/month equivalent · ${b.frequency||'monthly'}${b.active===false?' · Paused':''}</small></div><div style="display:flex;gap:6px;align-items:center"><button class="secondary" data-billedit="${idx}">Edit</button><button class="danger" data-billdelete="${idx}">×</button></div></div>`).join(''):'<div class="empty"><div class="emoji">🧾</div><strong>No recurring bills yet</strong>Add council tax, utilities, home insurance, subscriptions and other regular shared bills.</div>'}</div>
<div class="section-head"><h2>Shared grocery budget</h2></div><div class="card"><div class="field"><label for="groceryBudgetInput">Monthly grocery budget (£)</label><input id="groceryBudgetInput" type="number" min="0" step="1" value="${d.groceryBudget}"></div><div class="summary-grid" style="margin:0"><div><div class="metric-label">Spent this month</div><div class="metric">${money(d.grocerySpent)}</div></div><div><div class="metric-label">Budget remaining</div><div class="metric ${d.groceryLeft<0?'negative':''}">${money(d.groceryLeft)}</div></div></div><div class="progress ${d.groceryLeft<0?'over':''}"><span style="width:${Math.min(100,d.groceryBudget?d.grocerySpent/d.groceryBudget*100:0)}%"></span></div><div class="setting-line"><div><strong>${esc(state.people[1]||'Your wife')}'s share of groceries</strong><small>${(d.partnerPct*100).toFixed(1)}% of recorded shared grocery spending</small></div><div class="row-amount">${money(d.partnerGroceryShare)}</div></div><div class="setting-line"><div><strong>Groceries paid by ${esc(state.people[1]||'your wife')}</strong><small>Credited against her share</small></div><div class="row-amount">−${money(d.groceryPaidByPartner)}</div></div><p class="tiny">Record grocery purchases as expenses in the Groceries category and select who paid. Mark personal grocery purchases as Personal so they are excluded from the shared total.</p></div>
<div class="section-head"><h2>Monthly settlement</h2></div><div class="card"><div class="setting-line"><div><strong>Her share of remaining bills</strong></div><div class="row-amount">${money(d.partnerBillShare)}</div></div><div class="setting-line"><div><strong>Her share of groceries</strong></div><div class="row-amount">${money(d.partnerGroceryShare)}</div></div><div class="setting-line"><div><strong>Less groceries she paid for</strong></div><div class="row-amount">−${money(d.groceryPaidByPartner)}</div></div><div class="field"><label for="partnerTransfer">Money your wife has transferred to you this month (£)</label><input id="partnerTransfer" type="number" min="0" step="0.01" value="${d.partnerTransfers}"><small class="tiny">Enter transfers already received towards shared bills/groceries. This amount is subtracted from the balance due.</small></div><button class="primary" id="saveSettlement" style="width:100%">Save transfer amount</button><div class="success-note" style="margin-top:14px"><div class="metric-label">${d.partnerOwes>=0?esc(state.people[1]||'Your wife')+' still owes you':'You owe '+esc(state.people[1]||'your wife')}</div><div class="metric">${money(Math.abs(d.partnerOwes))}</div><div class="metric-note">For ${monthName(m)} · based on bills and recorded shared groceries</div></div></div>
<div class="section-head"><h2>Personal spending budgets</h2></div><p class="subtext">These budgets are separate for each of you and do not affect the shared bill split. Mark your own transactions as Personal and select who spent the money.</p><div class="card"><form id="personalBudgetForm"><div class="field"><label for="mePersonalBudget">${esc(state.people[0]||'You')} — personal monthly budget (£)</label><input id="mePersonalBudget" type="number" min="0" step="1" value="${d.mePersonalBudget}"></div><div class="setting-line"><div><strong>Personal spending so far</strong><small>${esc(state.people[0]||'You')}</small></div><div class="row-amount">${money(d.mePersonalSpent)}<small>${d.mePersonalBudget?money(d.mePersonalBudget-d.mePersonalSpent)+' budget left':'No limit set'}</small></div></div><div class="field"><label for="partnerPersonalBudget">${esc(state.people[1]||'Your wife')} — personal monthly budget (£)</label><input id="partnerPersonalBudget" type="number" min="0" step="1" value="${d.partnerPersonalBudget}"></div><div class="setting-line"><div><strong>Personal spending so far</strong><small>${esc(state.people[1]||'Your wife')}</small></div><div class="row-amount">${money(d.partnerPersonalSpent)}<small>${d.partnerPersonalBudget?money(d.partnerPersonalBudget-d.partnerPersonalSpent)+' budget left':'No limit set'}</small></div></div><button class="primary" type="submit" style="width:100%">Save personal budgets</button></form></div>

tem.name||item.amount<=0)return;if(old)state.bills[index]=item;else state.bills.push(item);save();close();render()}}

ument.getElementById('pbBackdrop').onclick=e=>{if(e.target.id==='pbBackdrop')close()};document.getElementById('pbForm').onsubmit=e=>{e.preventDefault();const item={name:document.getElementById('pbName').value.trim(),person:document.getElementById('pbPerson').value,amount:Number(document.getElementById('pbAmount').value),frequency:document.getElementById('pbFrequency').value,active:document.getElementById('pbActive').checked};if(!item.name||item.amount<=0)return;if(old)state.personalBills[index]=item;else state.personalBills.push(item);save();close();render()};if(old)document.getElementById('pbDelete').onclick=()=>{if(confirm(`Delete personal bill “${old.name}”?`)){state.personalBills.splice(index,1);save();close();render()}}}

function settingsPage(){return `<h1 class="page-title">Settings & backup</h1><p class="subtext">Manage your household profile and protect your records.</p><div class="card hero-card"><div class="settings-block"><h3>Household members</h3><p class="subtext">Choose names to show beside transactions.</p>${state.people.map((p,i)=>`<div class="setting-line"><div><strong>${esc(p)}</strong><small>Household member ${i+1}</small></div><button class="secondary" data-personedit="${i}">Rename</button></div>`).join('')}<button class="secondary" id="addPerson" style="width:100%;margin-top:10px">＋ Add household member</button></div><div class="settings-block"><h3>Backup and export</h3><p class="subtext">Your records are saved in this browser on this device. Export backups regularly.</p><div class="setting-line"><div><strong>Export backup</strong><small>Save transactions, budgets, income settings and recurring bills as a JSON file.</small></div><button class="primary" id="exportJson">Export</button></div><div class="setting-line"><div><strong>Export spreadsheet</strong><small>Download transactions as a CSV file.</small></div><button class="secondary" id="exportCsv">CSV</button></div><div class="setting-line"><div><strong>Restore backup</strong><small>Load a JSON backup you exported previously.</small></div><button class="secondary" id="importJson">Import</button></div><input type="file" id="importFile" accept=".json,application/json" class="hidden"></div><div class="settings-block"><h3>Privacy and storage</h3><div class="notice">This version stores information locally in this browser. It does not send your transactions to a server. Other devices will not automatically receive your changes. Anyone with access to this browser profile may be able to open the app.</div><div class="setting-line"><div><strong>Clear all app data</strong><small>Permanently remove saved transactions, members and budgets from this device.</small></div><button class="danger" id="clearData">Clear</button></div></div><div class="settings-block"><h3>About</h3><div class="setting-line"><div><strong>Household Expense Tracker</strong><small>Version 1.4 · Household summary and personal recurring bills · GBP (£)</small></div><span class="pill">MVP</span></div></div></div>`}
function bindDynamic(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>setPage(b.dataset.goto));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTxModal(b.dataset.edit));document.querySelectorAll('[data-budget]').forEach(inp=>inp.onchange=()=>{const c=cat(inp.dataset.budget);c.budget=Math.max(0,Number(inp.value)||0);save();render()});document.querySelectorAll('[data-editcat]').forEach(b=>b.onclick=()=>openCategoryModal(b.dataset.editcat));const qs=id=>document.getElementById(id);if(qs('txSearch'))qs('txSearch').oninput=e=>{filters.search=e.target.value;const pos=e.target.selectionStart;render();const el=qs('txSearch');el.focus();el.setSelectionRange(pos,pos)};if(qs('txType'))qs('txType').onchange=e=>{filters.type=e.target.value;render()};if(qs('txCategory'))qs('txCategory').onchange=e=>{filters.category=e.target.value;render()};if(qs('txPerson'))qs('txPerson').onchange=e=>{filters.person=e.target.value;render()};if(qs('incomeForm'))qs('incomeForm').onsubmit=e=>{e.preventDefault();state.incomes={me:Math.max(0,Number(qs('incomeMe').value)||0),partner:Math.max(0,Number(qs('incomePartner').value)||0),rent:Number(qs('rentGross').value)||0,propertyCosts:Number(qs('propertyCosts').value)||0};save();render()};if(qs('personalBudgetForm'))qs('personalBudgetForm').onsubmit=e=>{e.preventDefault();state.personalBudgets={me:Math.max(0,Number(qs('mePersonalBudget').value)||0),partner:Math.max(0,Number(qs('partnerPersonalBudget').value)||0)};save();render()};if(qs('groceryBudgetInput'))qs('groceryBudgetInput').onchange=()=>{state.groceryBudget=Math.max(0,Number(qs('groceryBudgetInput').value)||0);const g=state.categories.find(c=>c.name==='Groceries');if(g)g.budget=state.groceryBudget;save();render()};if(qs('saveSettlement'))qs('saveSettlement').onclick=()=>{const m=qs('monthPicker').value||monthISO();state.reimbursements[m]=Math.max(0,Number(qs('partnerTransfer').value)||0);save();render()};if(qs('addBill'))qs('addBill').onclick=()=>openBillModal();if(qs('addPersonalBill'))qs('addPersonalBill').onclick=()=>openPersonalBillModal();document.querySelectorAll('[data-pbedit]').forEach(b=>b.onclick=()=>openPersonalBillModal(Number(b.dataset.pbedit)));document.querySelectorAll('[data-pbdelete]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.pbdelete);if(confirm(`Delete personal bill “${state.personalBills[i].name}”?`)){state.personalBills.splice(i,1);save();render()}});document.querySelectorAll('[data-billedit]').forEach(b=>b.onclick=()=>openBillModal(Number(b.dataset.billedit)));document.querySelectorAll('[data-billdelete]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.billdelete);if(confirm(`Delete recurring bill “${state.bills[i].name}”?`)){state.bills.splice(i,1);save();render()}});if(qs('addCategory'))qs('addCategory').onclick=()=>openCategoryModal();if(qs('addPerson'))qs('addPerson').onclick=()=>renamePerson(-1);if(qs('exportJson'))qs('exportJson').onclick=exportJson;if(qs('exportCsv'))qs('exportCsv').onclick=exportCsv;if(qs('importJson'))qs('importJson').onclick=()=>qs('importFile').click();if(qs('importFile'))qs('importFile').onchange=importJson;if(qs('clearData'))qs('clearData').onclick=clearData;document.querySelectorAll('[data-personedit]').forEach(b=>b.onclick=()=>renamePerson(Number(b.dataset.personedit)))}
function openTxModal(id=null){editingId=id;const t=id?state.transactions.find(x=>x.id===id):null;const cats=state.categories.map(c=>`<option ${t?.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('');const people=state.people.map(p=>`<option ${t?.person===p?'selected':''}>${esc(p)}</option>`).join('');document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${t?'Edit transaction':'Add transaction'}</h2><button class="close-btn" id="closeModal" aria-label="Close">×</button></div><form id="txForm"><div class="field"><label>Type</label><select id="fType"><option value="expense" ${t?.type!=='income'?'selected':''}>Expense</option><option value="income" ${t?.type==='income'?'selected':''}>Income</option></select></div><div class="form-grid"><div class="field"><label for="fAmount">Amount (£)</label><input id="fAmount" type="number" min="0.01" max="100000000" step="0.01" placeholder="0.00" required value="${t?Number(t.amount):''}"></div><div class="field"><label for="fDate">Date</label><input id="fDate" type="date" required value="${t?.date||todayISO()}"></div></div><div class="field"><label for="fDesc">Description</label><input id="fDesc" maxlength="100" placeholder="e.g. Weekly shop" required value="${esc(t?.description||'')}"></div><div class="form-grid"><div class="field"><label for="fCat">Category</label><select id="fCat">${cats}</select></div><div class="field"><label for="fPerson">Paid by / received by</label><select id="fPerson">${people}</select></div></div><div class="field"><label for="fScope">Expense type</label><select id="fScope"><option value="personal" ${(t?.scope||(((t?.category||state.categories[0]?.name)==='Groceries'||(t?.category||state.categories[0]?.name)==='Household bills')?'shared':'personal'))==='personal'?'selected':''}>Personal — my own spending</option><option value="shared" ${(t?.scope||(((t?.category||state.categories[0]?.name)==='Groceries'||(t?.category||state.categories[0]?.name)==='Household bills')?'shared':'personal'))==='shared'?'selected':''}>Shared household</option></select><small class="tiny">Shared grocery purchases count towards the £500 budget and settlement. Personal purchases stay separate.</small></div><div class="field"><label for="fMethod">Payment method (optional)</label><select id="fMethod"><option value="">Not specified</option>${['Debit card','Credit card','Cash','Direct debit','Bank transfer','Other'].map(x=>`<option ${t?.method===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="fNotes">Notes (optional)</label><textarea id="fNotes" maxlength="500" placeholder="Any useful details">${esc(t?.notes||'')}</textarea></div><div class="modal-actions">${t?'<button type="button" class="danger" id="deleteTx">Delete</button>':''}<button class="primary" type="submit">${t?'Save changes':'Save transaction'}</button></div></form></div></div>`;const close=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('closeModal').onclick=close;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.getElementById('fCat').onchange=()=>{const c=document.getElementById('fCat').value;if(c==='Groceries'||c==='Household bills')document.getElementById('fScope').value='shared'};document.getElementById('txForm').onsubmit=e=>{e.preventDefault();const amount=Number(document.getElementById('fAmount').value);if(!Number.isFinite(amount)||amount<=0){alert('Enter an amount greater than zero.');return}const old=t||{};const item={id:old.id||crypto.randomUUID?.()||String(Date.now()),type:document.getElementById('fType').value,amount:Math.round(amount*100)/100,date:document.getElementById('fDate').value,description:document.getElementById('fDesc').value.trim(),category:document.getElementById('fCat').value,scope:document.getElementById('fScope').value,person:document.getElementById('fPerson').value,method:document.getElementById('fMethod').value,notes:document.getElementById('fNotes').value.trim(),createdAt:old.createdAt||Date.now()};if(!item.description||!item.date){alert('Please complete the description and date.');return}if(t)state.transactions=state.transactions.map(x=>x.id===t.id?item:x);else state.transactions.push(item);save();document.getElementById('monthPicker').value=item.date.slice(0,7);close();render()};if(t)document.getElementById('deleteTx').onclick=()=>{if(confirm(`Delete “${t.description}” (${money(t.amount)})?`)){state.transactions=state.transactions.filter(x=>x.id!==t.id);save();close();render()}};setTimeout(()=>document.getElementById('fAmount')?.focus(),60)}
function openCategoryModal(name=''){const old=name?cat(name):null;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${old?'Edit category':'Add category'}</h2><button class="close-btn" id="closeModal">×</button></div><form id="catForm"><div class="field"><label>Category name</label><input id="catName" maxlength="32" required value="${esc(old?.name||'')}" placeholder="e.g. Holidays"></div><div class="form-grid"><div class="field"><label>Icon (emoji)</label><input id="catIcon" maxlength="8" value="${esc(old?.icon||'✨')}"></div><div class="field"><label>Monthly budget (£)</label><input id="catBudget" type="number" min="0" step="10" value="${Number(old?.budget)||0}"></div></div><div class="modal-actions">${old?'<button type="button" class="danger" id="deleteCat">Delete</button>':''}<button class="primary" type="submit">Save category</button></div></form></div></div>`;const close=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('closeModal').onclick=close;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.getElementById('catForm').onsubmit=e=>{e.preventDefault();const newName=document.getElementById('catName').value.trim();if(!newName)return;if(state.categories.some(c=>c.name.toLowerCase()===newName.toLowerCase()&&c.name!==name)){alert('A category with that name already exists.');return}if(old){state.categories=state.categories.map(c=>c.name===name?{...c,name:newName,icon:document.getElementById('catIcon').value||'✨',budget:Math.max(0,Number(document.getElementById('catBudget').value)||0)}:c);state.transactions.forEach(t=>{if(t.category===name)t.category=newName})}else state.categories.push({name:newName,icon:document.getElementById('catIcon').value||'✨',color:'#e8f1f0',budget:Math.max(0,Number(document.getElementById('catBudget').value)||0)});save();close();render()};if(old)document.getElementById('deleteCat').onclick=()=>{if(state.transactions.some(t=>t.category===name)){alert('This category has transactions. Edit those transactions to another category before deleting it.');return}if(confirm(`Delete category “${name}”?`)){state.categories=state.categories.filter(c=>c.name!==name);save();close();render()}}}
function renamePerson(i){const old=i<0?'':state.people[i];const name=prompt(i<0?'Name for the new household member:':'Rename household member:',old);if(name===null)return;const v=name.trim();if(!v){alert('Please enter a name.');return}if(state.people.some((p,j)=>p.toLowerCase()===v.toLowerCase()&&j!==i)){alert('That name is already in use.');return}if(i<0)state.people.push(v);else{state.people[i]=v;state.transactions.forEach(t=>{if(t.person===old)t.person=v})}save();render()}
function download(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJson(){download(`household-tracker-backup-${todayISO()}.json`,JSON.stringify(state,null,2),'application/json')}
function exportCsv(){const rows=[['Date','Type','Description','Category','Amount GBP','Paid by / received by','Payment method','Notes'],...state.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type,t.description,t.category,Number(t.amount).toFixed(2),t.person,t.method||'',t.notes||''])];const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(`household-transactions-${todayISO()}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8')}
function importJson(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if((v.version!==1&&v.version!==2&&v.version!==3&&v.version!==4)||!Array.isArray(v.transactions)||!Array.isArray(v.categories)||!Array.isArray(v.people))throw new Error('This does not look like a Household Tracker backup.');if(!confirm(`Restore backup with ${v.transactions.length} transactions? This replaces the data currently saved in this browser.`))return;state={version:4,people:v.people,categories:v.categories,transactions:v.transactions,budgetsMonth:v.budgetsMonth||monthISO(),incomes:v.incomes||{me:0,partner:0,rent:0,propertyCosts:0},bills:Array.isArray(v.bills)?v.bills:[],personalBills:Array.isArray(v.personalBills)?v.personalBills:[],groceryBudget:Number(v.groceryBudget)||500,reimbursements:v.reimbursements&&typeof v.reimbursements==='object'?v.reimbursements:{},personalBudgets:v.personalBudgets&&typeof v.personalBudgets==='object'?v.personalBudgets:{me:0,partner:0}};state.transactions.forEach(t=>{if(!t.scope)t.scope=t.category==='Groceries'||t.category==='Household bills'?'shared':'personal'});const gc=state.categories.find(c=>c.name==='Groceries');if(gc&&gc.budget===450)gc.budget=state.groceryBudget;save();render();alert('Backup restored.')}catch(err){alert('Could not restore backup: '+err.message)}finally{e.target.value=''}};reader.readAsText(file)}
function clearData(){if(!confirm('This permanently deletes all transactions, categories and household members saved by this app on this device. Export a backup first if you may need these records. Continue?'))return;if(!confirm('Final confirmation: clear all Household Tracker data?'))return;state=initial();save();render()}
document.getElementById('fab').onclick=()=>openTxModal();document.getElementById('headerAdd').onclick=()=>openTxModal();document.getElementById('monthPicker').value=monthISO();document.getElementById('monthPicker').onchange=()=>{updateHeader();render()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();
</script>
